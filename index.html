<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Offline Deep Brown Noise Ambient Synthesizer PWA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brown Noise">
  <title>Brown Noise PWA</title>

  <style>
    /* CSS Variables & Modern Dark Design Token Palette */
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #b18e83;
      --accent-hover: #c9a79c;
      --accent-glow: rgba(177, 142, 131, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --track-bg: #334155;
      --install-bg: #0284c7;
      --install-hover: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Top Install Banner (PWA Prompt) */
    .pwa-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.2), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pwa-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pwa-icon {
      width: 36px;
      height: 36px;
      border-radius: 0.5rem;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .pwa-text h4 {
      font-size: 0.9rem;
      color: #fff;
    }

    .pwa-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .install-btn {
      background-color: var(--install-bg);
      color: #fff;
      border: none;
      padding: 0.5rem 0.875rem;
      border-radius: 0.625rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .install-btn:hover {
      background-color: var(--install-hover);
    }

    /* Header */
    header {
      text-align: center;
      padding-top: 0.5rem;
    }

    .app-title {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .app-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.25rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Visualizer */
    .visualizer-card {
      position: relative;
      padding: 0.75rem;
      overflow: hidden;
    }

    .visualizer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      padding: 0 0.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
    }

    .status-dot.active {
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .viz-mode-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.25rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .viz-mode-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    canvas {
      width: 100%;
      height: 110px;
      display: block;
      border-radius: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
    }

    /* Play Button */
    .play-container {
      display: flex;
      justify-content: center;
      margin: 0.25rem 0 0.875rem 0;
    }

    .play-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #7d5449, #38241f);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    .play-icon {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    /* Controls Grid */
    .controls-grid {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .control-group {
      background: rgba(0, 0, 0, 0.25);
      padding: 0.75rem 0.875rem;
      border-radius: 0.875rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      font-size: 0.825rem;
      font-weight: 500;
    }

    .value-display {
      font-family: monospace;
      color: var(--accent);
      font-size: 0.8rem;
    }

    /* Range Sliders */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: var(--track-bg);
      border-radius: 9999px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.2);
    }

    input[type=range]::-moz-range-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: var(--track-bg);
      border-radius: 9999px;
    }

    input[type=range]::-moz-range-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Presets */
    .presets-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .presets-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    @media (min-width: 480px) {
      .presets-row {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.25rem;
      border-radius: 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: rgba(177, 142, 131, 0.15);
      border-color: var(--accent);
    }

    footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
  </style>

  <!-- Dynamic Inline Manifest Injection Script -->
  <script>
    (function injectPWAManifest() {
      // 1. Generate App Icon as Data URI via Canvas
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Gradient Background
      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#1e293b');
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Icon Graphic (Brown Noise Waves)
      ctx.fillStyle = '#b18e83';
      ctx.beginPath();
      ctx.arc(256, 256, 180, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(256, 256, 140, 0, Math.PI * 2);
      ctx.fill();

      // Waves
      ctx.strokeStyle = '#b18e83';
      ctx.lineWidth = 20;
      ctx.lineCap = 'round';
      
      ctx.beginPath();
      ctx.arc(256, 256, 80, Math.PI * 0.2, Math.PI * 0.8);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(256, 256, 40, Math.PI * 1.2, Math.PI * 1.8);
      ctx.stroke();

      const iconDataUrl = canvas.toDataURL('image/png');

      // Set Apple Touch Icon & Favicon dynamically
      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconDataUrl;
      document.head.appendChild(appleIcon);

      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = 'image/png';
      favicon.href = iconDataUrl;
      document.head.appendChild(favicon);

      // 2. Build Web App Manifest JSON Object
      const manifest = {
        name: "Brown Noise Generator PWA",
        short_name: "Brown Noise",
        description: "Deep offline brown noise generator and wave synthesizer",
        start_url: "./",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        orientation: "portrait",
        icons: [
          {
            src: iconDataUrl,
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };

      // 3. Convert Manifest to Blob URL and append link element
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = manifestUrl;
      document.head.appendChild(manifestLink);
    })();
  </script>
</head>

  <script>
    /* ==========================================================================
       1. SERVICE WORKER INLINE REGISTRATION (Blob URL)
       ========================================================================== */
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'brown-noise-pwa-v1';
        
        self.addEventListener('install', (event) => {
          self.skipWaiting();
        });

        self.addEventListener('activate', (event) => {
          event.waitUntil(clients.claim());
        });

        self.addEventListener('fetch', (event) => {
          // Serve cached response or fetch from network
          event.respondWith(
            caches.match(event.request).then((response) => {
              return response || fetch(event.request).catch(() => {
                return new Response('Offline - Brown Noise App Loaded');
              });
            })
          );
        });
      `;

      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);

      window.addEventListener('load', () => {
        navigator.serviceWorker.register(swUrl)
          .then((reg) => console.log('Inline SW registered:', reg.scope))
          .catch((err) => console.warn('SW registration failed:', err));
      });
    }

    /* ==========================================================================
       2. PWA INSTALL PROMPT EVENT HANDLER
       ========================================================================== */
    let deferredPrompt = null;
    const pwaBanner = document.getElementById('pwaBanner');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User installed the PWA');
        }
        deferredPrompt = null;
        pwaBanner.style.display = 'none';
      }
    });

    window.addEventListener('appinstalled', () => {
      pwaBanner.style.display = 'none';
      deferredPrompt = null;
    });

    /* ==========================================================================
       3. WEB AUDIO SYNTHESIS & BACKGROUND PLAYBACK ENGINE
       ========================================================================== */
    let audioCtx = null;
    let noiseNode = null;
    let filterNode = null;
    let bassEqNode = null;
    let masterGainNode = null;
    let lfoOsc = null;
    let lfoGainNode = null;
    let analyserNode = null;

    let isPlaying = false;
    let vizMode = 'waveform';
    let animFrameId = null;

    // DOM References
    const silentAudio = document.getElementById('silentAudio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const volumeSlider = document.getElementById('volumeSlider');
    const volumeVal = document.getElementById('volumeVal');
    const cutoffSlider = document.getElementById('cutoffSlider');
    const cutoffVal = document.getElementById('cutoffVal');
    const bassSlider = document.getElementById('bassSlider');
    const bassVal = document.getElementById('bassVal');
    const lfoRateSlider = document.getElementById('lfoRateSlider');
    const lfoRateVal = document.getElementById('lfoRateVal');
    const lfoDepthSlider = document.getElementById('lfoDepthSlider');
    const lfoDepthVal = document.getElementById('lfoDepthVal');

    const vizCanvas = document.getElementById('vizCanvas');
    const vizModeBtn = document.getElementById('vizModeBtn');
    const canvasCtx = vizCanvas.getContext('2d');

    const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    function initAudioEngine() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // Create a 2-second looped noise buffer (Brownian Random Walk)
      const bufferSize = 2 * audioCtx.sampleRate;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);

      let lastOutput = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (lastOutput + (0.02 * white)) / 1.02;
        lastOutput = output[i];
        output[i] *= 3.5;
      }

      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = noiseBuffer;
      noiseNode.loop = true;

      // Low-Pass Filter
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.setValueAtTime(parseFloat(cutoffSlider.value), audioCtx.currentTime);

      // Low-Shelf Filter
      bassEqNode = audioCtx.createBiquadFilter();
      bassEqNode.type = 'lowshelf';
      bassEqNode.frequency.setValueAtTime(100, audioCtx.currentTime);
      bassEqNode.gain.setValueAtTime(parseFloat(bassSlider.value), audioCtx.currentTime);

      // Ocean LFO Oscillator
      lfoOsc = audioCtx.createOscillator();
      lfoGainNode = audioCtx.createGain();
      lfoOsc.frequency.setValueAtTime(parseFloat(lfoRateSlider.value), audioCtx.currentTime);
      lfoGainNode.gain.setValueAtTime(parseFloat(lfoDepthSlider.value), audioCtx.currentTime);

      lfoOsc.connect(lfoGainNode);
      lfoGainNode.connect(filterNode.frequency);

      // Master Volume Gain
      masterGainNode = audioCtx.createGain();
      masterGainNode.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);

      // Visualizer Analyser
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 1024;

      // Audio Graph Connection
      noiseNode.connect(bassEqNode);
      bassEqNode.connect(filterNode);
      filterNode.connect(masterGainNode);
      masterGainNode.connect(analyserNode);
      analyserNode.connect(audioCtx.destination);

      noiseNode.start(0);
      lfoOsc.start(0);

      setupMediaSession();
    }

    /**
     * Media Session API Handler for Android Lock Screen & Background Playback
     */
    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Brown Noise Generator',
          artist: 'PWA Ambient Audio',
          album: 'Deep Sound Engine'
        });

        navigator.mediaSession.setActionHandler('play', () => {
          if (!isPlaying) startPlayback();
        });

        navigator.mediaSession.setActionHandler('pause', () => {
          if (isPlaying) stopPlayback();
        });
      }
    }

    async function startPlayback() {
      if (!audioCtx) {
        initAudioEngine();
      }

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      // Play silent audio loop to hold background thread priority on mobile OS
      silentAudio.play().catch(() => {});

      masterGainNode.gain.setTargetAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime, 0.05);

      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'playing';
      }

      isPlaying = true;
      playIcon.innerHTML = ICON_PAUSE;
      statusDot.classList.add('active');
      statusText.innerText = 'Playing';

      drawVisualizer();
    }

    function stopPlayback() {
      if (masterGainNode && audioCtx) {
        masterGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
      }

      silentAudio.pause();

      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'paused';
      }

      isPlaying = false;
      playIcon.innerHTML = ICON_PLAY;
      statusDot.classList.remove('active');
      statusText.innerText = 'Paused';

      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
      }
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    /* ==========================================================================
       4. CANVAS VISUALIZER
       ========================================================================== */
    function resizeCanvas() {
      vizCanvas.width = vizCanvas.clientWidth * window.devicePixelRatio;
      vizCanvas.height = vizCanvas.clientHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawVisualizer() {
      if (!isPlaying) return;

      animFrameId = requestAnimationFrame(drawVisualizer);

      const w = vizCanvas.width;
      const h = vizCanvas.height;
      canvasCtx.clearRect(0, 0, w, h);

      if (vizMode === 'waveform') {
        const bufferLength = analyserNode.fftSize;
        const dataArray = new Uint8Array(bufferLength);
        analyserNode.getByteTimeDomainData(dataArray);

        canvasCtx.lineWidth = 2 * window.devicePixelRatio;
        canvasCtx.strokeStyle = '#b18e83';
        canvasCtx.beginPath();

        const sliceWidth = w / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * h) / 2;

          if (i === 0) canvasCtx.moveTo(x, y);
          else canvasCtx.lineTo(x, y);

          x += sliceWidth;
        }

        canvasCtx.lineTo(w, h / 2);
        canvasCtx.stroke();
      } else {
        const bufferLength = analyserNode.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyserNode.getByteFrequencyData(dataArray);

        const barWidth = (w / bufferLength) * 2.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = (dataArray[i] / 255) * h;

          const gradient = canvasCtx.createLinearGradient(0, h, 0, 0);
          gradient.addColorStop(0, '#38241f');
          gradient.addColorStop(0.6, '#7d5449');
          gradient.addColorStop(1, '#b18e83');

          canvasCtx.fillStyle = gradient;
          canvasCtx.fillRect(x, h - barHeight, barWidth, barHeight);

          x += barWidth + 1;
        }
      }
    }

    vizModeBtn.addEventListener('click', () => {
      vizMode = vizMode === 'waveform' ? 'spectrum' : 'waveform';
      vizModeBtn.innerText = `Mode: ${vizMode.charAt(0).toUpperCase() + vizMode.slice(1)}`;
    });

    /* ==========================================================================
       5. CONTROLS & PRESETS
       ========================================================================== */
    volumeSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      volumeVal.innerText = `${Math.round(v * 100)}%`;
      if (masterGainNode && isPlaying) {
        masterGainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
      }
    });

    cutoffSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      cutoffVal.innerText = `${v} Hz`;
      if (filterNode) {
        filterNode.frequency.setTargetAtTime(v, audioCtx.currentTime, 0.01);
      }
    });

    bassSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      bassVal.innerText = `+${v} dB`;
      if (bassEqNode) {
        bassEqNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
      }
    });

    lfoRateSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      lfoRateVal.innerText = `${v.toFixed(2)} Hz`;
      if (lfoOsc) {
        lfoOsc.frequency.setTargetAtTime(v, audioCtx.currentTime, 0.01);
      }
    });

    lfoDepthSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      lfoDepthVal.innerText = `${v} Hz`;
      if (lfoGainNode) {
        lfoGainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
      }
    });

    const presetConfigs = {
      space: { cutoff: 180, bass: 6, lfoRate: 0.04, lfoDepth: 80 },
      ocean: { cutoff: 550, bass: 3, lfoRate: 0.15, lfoDepth: 250 },
      womb: { cutoff: 320, bass: 8, lfoRate: 0.08, lfoDepth: 120 },
      thunder: { cutoff: 120, bass: 10, lfoRate: 0.02, lfoDepth: 50 }
    };

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-preset');
        const p = presetConfigs[key];
        if (!p) return;

        cutoffSlider.value = p.cutoff;
        cutoffVal.innerText = `${p.cutoff} Hz`;

        bassSlider.value = p.bass;
        bassVal.innerText = `+${p.bass} dB`;

        lfoRateSlider.value = p.lfoRate;
        lfoRateVal.innerText = `${p.lfoRate.toFixed(2)} Hz`;

        lfoDepthSlider.value = p.lfoDepth;
        lfoDepthVal.innerText = `${p.lfoDepth} Hz`;

        if (audioCtx) {
          filterNode.frequency.setTargetAtTime(p.cutoff, audioCtx.currentTime, 0.05);
          bassEqNode.gain.setTargetAtTime(p.bass, audioCtx.currentTime, 0.05);
          lfoOsc.frequency.setTargetAtTime(p.lfoRate, audioCtx.currentTime, 0.05);
          lfoGainNode.gain.setTargetAtTime(p.lfoDepth, audioCtx.currentTime, 0.05);
        }
      });
    });
  </script>
</body>
</html>
